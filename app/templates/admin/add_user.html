{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block content %}
<div class="page-header">
  <h2>Add New User</h2>
  <p>Create a lab technician or medic account</p>
</div>
<div class="card" style="max-width:480px">
  <form method="POST">
    <div class="form-group mb-16">
      <label>Username</label>
      <input type="text" name="username" class="form-control" required placeholder="e.g. labtech2">
    </div>
    <div class="form-group mb-16">
      <label>Password</label>
      <input type="password" name="password" class="form-control" required placeholder="Minimum 6 characters">
    </div>
    <div class="form-group mb-24">
      <label>Role</label>
      <select name="role" class="form-control" required>
        <option value="">Select role...</option>
        <option value="lab">Lab Technician</option>
        <option value="medic">Medic</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="flex gap-12">
      <button type="submit" class="btn btn-primary">Create User</button>
      <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
